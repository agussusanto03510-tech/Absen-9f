<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel Guru 9F</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:sans-serif;background:#111;color:#fff;padding:15px}.card{background:#fff;color:#222;border-radius:20px;padding:18px}#qrcode{display:flex;justify-content:center;margin:15px 0}.btn{width:100%;padding:13px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-weight:700;margin-top:10px}</style>
</head><body>
<h2>👨‍🏫 PANEL GURU 9F</h2>
<div class="card">
<input id="pass" type="password" placeholder="Password Guru (default: guru9f)" style="width:100%;padding:12px;border-radius:10px;border:2px solid #eee">
<button class="btn" onclick="login()">Login</button>
<div id="panel" style="display:none">
<div id="qrcode"></div><p id="qrText" style="text-align:center;font-weight:700"></p>
<button class="btn" onclick="buatQR()">🔄 Generate QR Hari Ini</button>
<button class="btn" style="background:#222" onclick="exportCSV()">📥 Export Excel</button>
<div id="list"></div>
</div>
</div>
<script>
let data=JSON.parse(localStorage.getItem('absenPro')||'[]');
function login(){if(document.getElementById('pass').value=='guru9f'){document.getElementById('panel').style.display='block';buatQR();render();}else alert('Password salah!');}
function buatQR(){let code='ABSEN-'+new Date().toLocaleDateString('id-ID')+'-'+Math.floor(Math.random()*9000);document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:code,width:200,height:200});document.getElementById('qrText').innerText=code;}
function render(){document.getElementById('list').innerHTML=data.map(d=>`<div style="background:#f5f3ff;padding:10px;border-radius:10px;margin-top:8px"><img src="${d.foto}" style="width:40px;height:40px;border-radius:50%"><b>${d.nama}</b> ${d.jam}</div>`).join('');}
function exportCSV(){let csv="Nama,Jam\n";data.forEach(d=>{csv+=`"${d.nama}","${d.jam}"\n`;});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='9F.csv';a.click();}
</script></body></html>
