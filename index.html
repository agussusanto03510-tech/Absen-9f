<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absen 9F PRO</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box;font-family:sans-serif;margin:0;padding:0}body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#fff;padding:12px}.tab{display:flex;gap:10px;margin:15px 0}.tab button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;background:rgba(255,255,255,.2);color:#fff}.tab button.active{background:#fff;color:#302b63}.card{background:#fff;color:#222;border-radius:20px;padding:18px}input{width:100%;padding:12px;border-radius:10px;border:2px solid #eee;margin:6px 0}.btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(90deg,#00f2ff,#7c3aed);color:#fff;font-weight:700;margin-top:10px}#qrcode{display:flex;justify-content:center;margin:15px 0}video{width:100%;border-radius:15px;background:#000;margin-top:10px}</style></head><body>
<h2 style="text-align:center;margin:10px">📚 ABSEN KELAS 9F</h2>
<div class="tab"><button id="bS" class="active" onclick="mode('s')">👨‍🎓 SISWA</button><button id="bG" onclick="mode('g')">👨‍🏫 GURU</button></div>
<div id="s" class="card"><input id="nama" placeholder="Nama Lengkap - 9F"><div id="reader"></div><button class="btn" onclick="startScan()">📷 Scan QR Guru</button><video id="cam" autoplay playsinline></video><canvas id="canvas" style="display:none"></canvas><button class="btn" onclick="bukaCam()">🤳 Buka Selfie</button><button class="btn" onclick="kirim()">🚀 KIRIM ABSEN 9F</button><div id="list"></div></div>
<div id="g" class="card" style="display:none"><input id="pass" type="password" placeholder="Masukan paswordnya"><button class="btn" onclick="login()">Login Guru</button><div id="panel" style="display:none"><div id="qrcode"></div><p id="qrText" style="text-align:center;font-weight:700"></p><button class="btn" onclick="buatQR()">🔄 Buat QR Baru</button><button class="btn" style="background:#222" onclick="exportCSV()">📥 Export</button><div id="listG"></div></div></div>
<script>
let data=JSON.parse(localStorage.getItem('absen9F')||'[]');function mode(m){document.getElementById('s').style.display=m=='s'?'block':'none';document.getElementById('g').style.display=m=='g'?'block':'none';document.getElementById('bS').classList.toggle('active',m=='s');document.getElementById('bG').classList.toggle('active',m=='g');}
function login(){if(document.getElementById('pass').value=='guru9f'){document.getElementById('panel').style.display='block';buatQR();render();}else alert('Salah! pass: guru9f');}
function buatQR(){let c='ABSEN-9F-'+new Date().toLocaleDateString('id-ID')+'-'+Math.floor(Math.random()*9000);document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:c,width:200,height:200});document.getElementById('qrText').innerText=c;}
function startScan(){let q=new Html5Qrcode("reader");q.start({facingMode:"environment"},{fps:10,qrbox:200},t=>{if(t.includes('ABSEN-9F')){alert('✅ QR Valid 9F');q.stop();}});}
async function bukaCam(){let v=document.getElementById('cam');v.style.display='block';try{v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})}catch(e){alert('Buka di Chrome & Allow Kamera')}}
function kirim(){let n=document.getElementById('nama').value;if(!n)return alert('Isi nama');let v=document.getElementById('cam');let c=document.getElementById('canvas');if(!v.srcObject)return alert('Buka kamera dulu');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let f=c.toDataURL();let jam=new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'});let tgl=new Date().toLocaleDateString('id-ID');if(data.find(d=>d.nama==n&&d.tgl==tgl))return alert('Udah absen hari ini');data.unshift({nama:n,kelas:'9F',jam,tgl,foto:f});localStorage.setItem('absen9F',JSON.stringify(data));render();alert('Berhasil '+jam);}
function render(){let t=new Date().toLocaleDateString('id-ID');let h=data.filter(d=>d.tgl==t);let html=h.map(d=>`<div style="background:#f5f3ff;padding:10px;border-radius:10px;margin-top:8px;display:flex;gap:10px;align-items:center"><img src="${d.foto}" style="width:45px;height:45px;border-radius:50%"><div><b>${d.nama}</b><br><small>${d.jam}</small></div></div>`).join('');document.getElementById('list').innerHTML=html;document.getElementById('listG').innerHTML=html;}render();
function exportCSV(){let csv="Nama,Jam\n";data.forEach(d=>{csv+=`${d.nama},${d.jam}\n`});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='absen-9F.csv';a.click();}
</script></body></html>
